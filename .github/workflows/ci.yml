name: ci

on:
  push:
  pull_request:

jobs:
  guard-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 提交守卫（全部已跟踪文件）
        run: node scripts/guard.mjs --all
      - name: 测试
        run: node --test
